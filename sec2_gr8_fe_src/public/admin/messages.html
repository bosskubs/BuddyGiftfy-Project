<!doctype html>
<!-- Render customer messages and prepare their status update forms. -->
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#fff9f6" />
    <meta
      name="description"
      content="BuddyGiftfy ร้านของขวัญที่เลือกด้วยใจ พร้อมบริการห่อของขวัญและเขียนการ์ดแทนความรู้สึก"
    />
    <title>ข้อความจากลูกค้า · BuddyGiftfy</title>
    <link rel="icon" href="/images/optimized/49794cc38e9a86-480.webp" />
    <link rel="stylesheet" href="/fonts.css" />
    <link rel="stylesheet" href="/modern.css" />
    <script src="/config.js" defer=""></script>
  </head>
  <body
    class="admin-body"
    data-page="messages"
    data-access="operations"
    data-endpoint="/api/admin/messages"
  >
    <a class="skip-link" href="#main">ข้ามไปเนื้อหา</a>
    <header class="admin-header">
      <button
        class="icon-button admin-menu-toggle"
        data-menu-toggle=""
        aria-controls="admin-nav"
        aria-expanded="false"
        aria-label="เปิดเมนูผู้ดูแล"
        type="submit"
      >
        <svg
          class="icon"
          width="20"
          height="20"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.7"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M4 6h16M4 12h16M4 18h16"></path>
        </svg></button
      ><a class="brand" href="/admin"
        ><img
          src="/images/optimized/e19ef2d6e0b5fb-480.webp"
          alt="BuddyGiftfy"
          width="64"
          height="64"
        /><span>BuddyGiftfy<small>พื้นที่ดูแลร้าน</small></span></a
      ><a class="btn btn-small btn-outline" href="/"
        ><svg
          class="icon"
          width="20"
          height="20"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.7"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M4 12h16m-6-6 6 6-6 6"></path></svg
        >ดูหน้าร้าน</a
      ><a class="admin-identity" href="/admin/profile"
        ><span class="avatar">T</span
        ><span
          ><span data-bind="account.first_name">—</span
          ><small>Owner</small></span
        ></a
      >
    </header>
    <div class="admin-shell">
      <aside id="admin-nav" class="admin-side">
        <span class="nav-caption">ดูแลทุกความรู้สึกดี ๆ</span>
        <nav aria-label="เมนูผู้ดูแล">
          <a href="/admin" data-roles="Owner,Manager"
            ><svg
              class="icon"
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.7"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <rect x="3" y="3" width="7" height="7" rx="1"></rect>
              <rect x="14" y="3" width="7" height="7" rx="1"></rect>
              <rect x="3" y="14" width="7" height="7" rx="1"></rect>
              <rect x="14" y="14" width="7" height="7" rx="1"></rect></svg
            >ภาพรวมร้าน</a
          ><a href="/admin/products"
            ><svg
              class="icon"
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.7"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path
                d="m12 2 9 5v10l-9 5-9-5V7l9-5ZM3 7l9 5 9-5M12 12v10M7 4.8l9 5"
              ></path></svg
            >สินค้า</a
          ><a href="/admin/categories" data-roles="Owner,Manager"
            ><svg
              class="icon"
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.7"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <rect x="3" y="3" width="7" height="7" rx="1"></rect>
              <rect x="14" y="3" width="7" height="7" rx="1"></rect>
              <rect x="3" y="14" width="7" height="7" rx="1"></rect>
              <rect x="14" y="14" width="7" height="7" rx="1"></rect></svg
            >หมวดหมู่</a
          ><a href="/admin/orders" data-roles="Owner,Manager"
            ><svg
              class="icon"
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.7"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M6 3h12v19l-3-2-3 2-3-2-3 2V3Z"></path>
              <path d="M9 8h6M9 12h6M9 16h3"></path></svg
            >คำสั่งซื้อ</a
          ><a href="/admin/payments" data-roles="Owner,Manager"
            ><svg
              class="icon"
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.7"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="m12 2 9 4v6c0 5-9 10-9 10S3 17 3 12V6l9-4Z"></path>
              <path d="m8 12 3 3 5-5"></path></svg
            >ตรวจสอบการชำระเงิน</a
          ><a href="/admin/customers" data-roles="Owner,Manager"
            ><svg
              class="icon"
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.7"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <circle cx="12" cy="8" r="4"></circle>
              <path d="M4 21v-2a8 8 0 0 1 16 0v2"></path></svg
            >ลูกค้า</a
          ><a
            href="/admin/messages"
            aria-current="page"
            data-roles="Owner,Manager"
            ><svg
              class="icon"
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.7"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <rect x="3" y="5" width="18" height="14" rx="2"></rect>
              <path d="m3 6 9 7 9-7"></path></svg
            >ข้อความจากลูกค้า</a
          ><a href="/admin/accounts" data-roles="Owner"
            ><svg
              class="icon"
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.7"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <circle cx="12" cy="8" r="4"></circle>
              <path d="M4 21v-2a8 8 0 0 1 16 0v2"></path></svg
            >ทีมผู้ดูแล</a
          ><a href="/admin/settings" data-roles="Owner"
            ><svg
              class="icon"
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.7"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path
                d="m9 3-1 3-3 1v4l-2 1 2 3v3l3 1 1 3h6l1-3 3-1v-3l2-3-2-1V7l-3-1-1-3H9Z"
              ></path>
              <circle cx="12" cy="12" r="3"></circle></svg
            >ตั้งค่าร้าน</a
          ><a href="/admin/profile"
            ><svg
              class="icon"
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.7"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <circle cx="12" cy="8" r="4"></circle>
              <path d="M4 21v-2a8 8 0 0 1 16 0v2"></path></svg
            >บัญชีของฉัน</a
          >
        </nav>
        <form
          method="post"
          action="/api/admin/logout"
          data-method="POST"
          data-wait-for-session=""
        >
          <input
            type="hidden"
            name="_csrf"
            value=""
            data-bind-value="{{session.csrf}}"
          /><button
            class="sidebar-logout"
            disabled=""
            data-session-lock=""
            type="submit"
          >
            <svg
              class="icon"
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.7"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M10 4H4v16h6m4-14 6 6-6 6M8 12h12"></path></svg
            >ออกจากระบบ
          </button>
        </form>
      </aside>
      <!-- Main page content; data-* hooks connect this markup to its controller. -->
      <main id="main" class="admin-main">
        <p class="muted page-data-status" data-page-status="" role="status">
          กำลังโหลดข้อมูล…
        </p>
        <div
          class="flash notice notice-error"
          data-page-error=""
          role="alert"
          hidden=""
        ></div>
        <div class="page-title">
          <div>
            <span class="eyebrow">CUSTOMER INBOX</span>
            <h1>ข้อความจากลูกค้า</h1>
            <p>ดูแลคำถามเกี่ยวกับสินค้า งานสั่งทำ และคำสั่งซื้อ</p>
          </div>
        </div>
        <div class="message-list" data-list="messages"></div>
      </main>
    </div>
    <div class="toast-stack" aria-live="polite" aria-atomic="false"></div>
    <!-- Inert templates are cloned by JavaScript to render repeated API results. -->
    <template id="product-card-template"
      ><article class="product-card">
        <div class="product-visual">
          <a
            href=""
            class="product-image"
            data-bind-href="/product?slug={{product.slug}}"
            ><img
              class=""
              src="/images/product-placeholder.svg"
              alt=""
              loading="lazy"
              decoding="async"
              width="600"
              height="600"
              data-bind-alt="{{product.name}}" /></a
          ><span class="product-tag">คัดมาให้แล้ว</span>
          <form
            action="/api/favorites/toggle"
            method="post"
            class="favorite-form"
            data-favorite-form=""
          >
            <input
              type="hidden"
              name="_csrf"
              value=""
              data-bind-value="{{session.csrf}}"
            /><input type="hidden" name="product_id" value="1" /><button
              type="submit"
              class="icon-button favorite-button"
              aria-label=""
              aria-pressed="false"
              data-favorite="1"
              data-bind-aria-label="บันทึกของขวัญที่ชอบ: {{product.name}}"
            >
              <svg
                class="icon"
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.7"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path
                  d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8Z"
                ></path>
              </svg>
            </button>
          </form>
        </div>
        <div class="product-copy">
          <span class="product-category"
            ><span data-bind="category.name">—</span></span
          >
          <h3>
            <a href="" data-bind-href="/product?slug={{product.slug}}"
              ><span data-bind="product.name">—</span></a
            >
          </h3>
          <div class="product-price-row">
            <strong><span data-bind="product.price|money">—</span></strong
            ><span class="stock-label">พร้อมส่ง</span>
          </div>
          <form method="post" action="/api/cart/add" data-add-cart="">
            <input
              type="hidden"
              name="_csrf"
              value=""
              data-bind-value="{{session.csrf}}"
            /><input type="hidden" name="product_id" value="1" /><input
              type="hidden"
              name="quantity"
              value="1"
            /><button class="product-add" type="submit">
              <svg
                class="icon"
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.7"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M12 5v14M5 12h14"></path></svg
              >เพิ่มลงตะกร้า
            </button>
          </form>
        </div>
      </article></template
    ><template id="empty-state-template"
      ><div class="empty-state">
        <span class="empty-symbol"
          ><svg
            class="icon"
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <rect x="3" y="8" width="18" height="4" rx="1"></rect>
            <path
              d="M5 12v9h14v-9M12 8v13M12 8H7.5A2.5 2.5 0 1 1 10 5.5L12 8Zm0 0h4.5A2.5 2.5 0 1 0 14 5.5L12 8Z"
            ></path></svg
        ></span>
        <h2>ยังไม่มีรายการ</h2>
        <p>ลองเปลี่ยนเกณฑ์หรือกลับมาใหม่</p>
        <a class="btn" href="/shop">เลือกของขวัญ</a>
      </div></template
    ><template id="badge-template"
      ><span class="status status-pending">รอชำระเงิน</span></template
    ><template id="messages"
      ><article class="panel message-card">
        <div class="panel-heading">
          <div>
            <h2>
              <span data-bind="customer.first_name">—</span>
              <span data-bind="customer.last_name">—</span>
            </h2>
            <a href="" data-bind-href="mailto:{{customer.email}}"
              ><span data-bind="customer.email">—</span></a
            ><small><span data-bind="order.created_at|date">—</span></small>
          </div>
          <span class="status status-new">ข้อความใหม่</span>
        </div>
        <p class="message-body"><span data-bind="message.message">—</span></p>
        <form method="post" action="/admin/messages/1/status">
          <input
            type="hidden"
            name="_csrf"
            value=""
            data-bind-value="{{session.csrf}}"
          /><label class="sr-only" for="message-1">สถานะข้อความ</label
          ><select id="message-1" name="status">
            <option value="New" selected="">ใหม่</option>
            <option value="Read">อ่านแล้ว</option>
            <option value="Resolved">ดูแลแล้ว</option></select
          ><button class="btn btn-small btn-outline" type="submit">
            บันทึกสถานะ</button
          ><a
            class="btn btn-small btn-text"
            href=""
            data-bind-href="mailto:{{customer.email}}"
            ><svg
              class="icon"
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.7"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <rect x="3" y="5" width="18" height="14" rx="2"></rect>
              <path d="m3 6 9 7 9-7"></path></svg
            >ตอบกลับทางอีเมล</a
          >
        </form>
      </article></template
    >
    <!-- The page module initializes session state and page-specific interactions. -->
    <script type="module" src="/js/pages/messages.js"></script>
  </body>
</html>
